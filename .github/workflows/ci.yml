name: CI
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @longform/shared build
      - run: pnpm --filter @longform/shared test
      - run: pnpm --filter @longform/server typecheck
      - run: pnpm --filter @longform/web build
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cd apps/swift && swift test
